image:
  name: registry.gitlab.com/ptl-website/github-pages-builder:latest

stages:
  - check
  - deploy

variables:
  JEKYLL_ENV: production
  BUNDLE_PATH: "${CI_PROJECT_DIR}/vendor/bundle"

cache:
  key:
    files:
      - website/Gemfile.lock
  paths:
    - vendor/bundle

before_script:
  - cd website && bundle install && cd ..

check:
  stage: check
  script:
    - ./check.sh

pages:
  stage: deploy
  script:
    - ./build.sh
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'